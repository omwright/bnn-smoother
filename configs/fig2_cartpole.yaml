# Figure 2, Table I — online dynamics learning on CartPole
#
# The model learns the transition function of a CartPole modified for
# continuous force, one transition at a time, and is evaluated on held-out
# transitions and on multi-step rollouts.
#
#   Proposed   kbnn_onestep   full dense weight covariance, one-step smoother
#   KBNN       wagner_kbnn    per-neuron block covariance, two-step smoother
#   TAGI       tagi           fully diagonal covariance, local linearization
#   GP         gp             exact GP, feasible here (5-D input, 500-point cap)
#   SGD        sgd            AdamW, single-sample, no uncertainty
#
# All neural methods use [50, 50] and see the identical stream in the same
# order.  The GP needs `uv sync --extra baselines`.
#
# COMMON PRIOR, c = 2.0.  The three BNN methods place a zero-mean Gaussian
# prior of per-weight variance c/n_in, expressed differently by each:
#
#   Proposed / KBNN   2 * weight_cov_init_scale / n_in  ->  wcis = c/2 = 1.0
#   TAGI              factor4Wp / n_in                  ->  factor4Wp = c = 2.0
#
# Everything below is tuned per method:
#
#   likelihood_noise 0.0   Safe because CartPole is near-deterministic.
#   process_noise 0.001    Inert at this magnitude.
#   Wagner noise 0.05      Best NLL of {0.005, 0.05, 0.2, 1.0}.
#   TAGI sigma_v 1.0       Default 0.32 is far worse here.
#
# Usage:
#   uv run python run_dynamics_experiment.py --config configs/fig2_cartpole.yaml

# ── Experiment ────────────────────────────────────────────────────────────────
seed: 7302519
device: cpu     # cpu | cuda | auto.  CPU is the reference.
environment: cartpole
n_trials: 20
n_episodes: 20
episode_length: 200
test_fraction: 0.2
n_eval_points: 50

# Give the proposed method and KBNN identical initial weights and covariances.
share_init: true

# Rollout evaluation
rollout_horizons: [1, 5, 10, 20]
n_rollout_trajectories: 50

# ── Methods ───────────────────────────────────────────────────────────────────
methods:

  - name: kbnn_onestep
    label: "Proposed"
    model:
      hidden_sizes: [50, 50]
      cov_type: dense
      activation: relu
      output_activation: linear
      weight_prior: he
      weight_cov_init_scale: 1.0    # shared prior c = 2.0
      process_noise: 0.001
      likelihood_noise: 0.0
      dtype: float32

  - name: wagner_kbnn
    label: "KBNN"
    model:
      hidden_sizes: [50, 50]
      activation: relu
      output_activation: linear
      use_bias: true
      noise: 0.05
      weight_prior: he
      weight_cov_init_scale: 1.0    # shared prior c = 2.0
      normalise: false
      dtype: float32

  - name: tagi
    label: "TAGI"
    model:
      hidden_sizes: [50, 50]
      activation: relu
      output_activation: linear
      sigma_v: 1.0
      factor4Wp: 2.0                # shared prior c = 2.0
      factor4Bp: 0.01
      process_noise: 0.0
      dtype: float32

  - name: sgd
    label: "SGD"
    model:
      hidden_sizes: [50, 50]
      activation: relu
      output_activation: linear
      lr: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      dtype: float32

  - name: gp
    label: "GP"
    model:
      mode: independent
      max_train_size: 500
      kernel: rbf
      learn_hyperparams: false
      dtype: float32
